			shellPath = /bin/sh;
			shellScript = "#!/bin/bash\n\n# 设置默认变量（增强兼容性）\nFMK_NAME=\"AWHOilSwift\"\nPROJECT_DIR=\"/Users/wangheng/Desktop/WangHengGit/AWHSDKBale\"\nFMK_DIR_NAME=\"${PROJECT_DIR}/${FMK_NAME}\"\nBUILD_ROOT=\"${PROJECT_DIR}/build\"  # 固定到项目内，避免权限问题\nCONFIGURATION=\"${CONFIGURATION:-Release}\"  # 添加默认配置\n\n# 打印调试信息（更详细的环境变量）\necho \"===== Framework合并脚本开始执行 =====\"\necho \"基本参数：\"\necho \"  FMK_NAME: ${FMK_NAME}\"\necho \"  PROJECT_DIR: ${PROJECT_DIR}\"\necho \"  输出目录: ${FMK_DIR_NAME}\"\necho \"  构建根目录: ${BUILD_ROOT}\"\necho \"  构建配置: ${CONFIGURATION}\"\necho \"  操作类型: ${ACTION:-未设置（非Xcode构建）}\"\necho \"======================================\"\n\n# 检查目录是否存在（增强错误提示）\ncheck_directory() {\n    if [ ! -d \"$1\" ]; then\n        echo \"❌ 错误: 目录不存在 - $1\"\n        echo \"   请检查路径是否正确，或是否已完成构建\"\n        exit 1\n    fi\n}\n\n# 确保基础目录存在\ncheck_directory \"${PROJECT_DIR}\"\nmkdir -p \"${BUILD_ROOT}\" || { \n    echo \"❌ 错误: 无法创建构建根目录（${BUILD_ROOT}）\"\n    echo \"   可能是权限不足，请手动创建或修改目录权限\"\n    exit 1\n}\n\nif [ \"${ACTION}\" = \"build\" ]; then\n    # 定义路径（明确区分设备/模拟器）\n    INSTALL_DIR=\"${FMK_DIR_NAME}/${FMK_NAME}.framework\"\n    DEVICE_DIR=\"${BUILD_ROOT}/${CONFIGURATION}-iphoneos/${FMK_NAME}.framework\"\n    SIMULATOR_DIR=\"${BUILD_ROOT}/${CONFIGURATION}-iphonesimulator/${FMK_NAME}.framework\"\n    \n    # 检查设备端和模拟器端framework是否存在\n    echo \"检查设备端Framework...\"\n    check_directory \"${DEVICE_DIR}\"\n    echo \"✅ 设备端Framework存在（路径：${DEVICE_DIR}）\"\n    \n    echo \"检查模拟器端Framework...\"\n    check_directory \"${SIMULATOR_DIR}\"\n    echo \"✅ 模拟器端Framework存在（路径：${SIMULATOR_DIR}）\"\n    \n    # 清理旧输出目录（更友好的提示）\n    if [ -d \"${INSTALL_DIR}\" ]; then\n        echo \"清理旧输出目录: ${INSTALL_DIR}\"\n        rm -rf \"${INSTALL_DIR}\" || { \n            echo \"❌ 错误: 无法删除旧目录\"\n            echo \"   请手动删除该目录后重试：${INSTALL_DIR}\"\n            exit 1\n        }\n    fi\n    mkdir -p \"${INSTALL_DIR}\" || { \n        echo \"❌ 错误: 无法创建输出目录（${INSTALL_DIR}）\"\n        exit 1\n    }\n    \n    # 复制设备端Framework（包含所有资源和元文件）\n    echo \"复制设备端Framework内容（二进制、plist、资源等）...\"\n    xattr -cr \"${DEVICE_DIR}\"  # 清除扩展属性（避免MacOS权限问题）\n    if cp -R -X \"${DEVICE_DIR}/\" \"${INSTALL_DIR}/\"; then\n        echo \"✅ 设备端内容复制成功（包含：$(ls -1 \"${DEVICE_DIR}\" | tr '\\n' ' ')）\"\n    else\n        echo \"❌ 错误: 复制设备端Framework失败\"\n        exit 1\n    fi\n    \n    # 定义二进制文件路径\n    DEVICE_BINARY=\"${DEVICE_DIR}/${FMK_NAME}\"\n    SIMULATOR_BINARY=\"${SIMULATOR_DIR}/${FMK_NAME}\"\n    \n    # 检查二进制文件是否存在\n    if [ ! -f \"${DEVICE_BINARY}\" ] || [ ! -f \"${SIMULATOR_BINARY}\" ]; then\n        echo \"❌ 错误: 设备端或模拟器端二进制文件不存在\"\n        echo \"   设备端: ${DEVICE_BINARY}（存在：$(test -f \"${DEVICE_BINARY}\" && echo \"是\" || echo \"否\")）\"\n        echo \"   模拟器端: ${SIMULATOR_BINARY}（存在：$(test -f \"${SIMULATOR_BINARY}\" && echo \"是\" || echo \"否\")）\"\n        exit 1\n    fi\n    \n    # 查看原始架构（调试用）\n    echo \"原始架构信息：\"\n    echo \"  设备端: $(lipo -info \"${DEVICE_BINARY}\" | awk -F': ' '{print $NF}')\"\n    echo \"  模拟器端: $(lipo -info \"${SIMULATOR_BINARY}\" | awk -F': ' '{print $NF}')\"\n    \n    # 处理模拟器架构冲突（动态判断是否需要移除arm64）\n    echo \"处理模拟器架构...\"\n    SIMULATOR_TEMP_BINARY=\"${SIMULATOR_DIR}/${FMK_NAME}_temp\"\n    \n    if lipo -info \"${SIMULATOR_BINARY}\" | grep -q \"arm64\"; then\n        # 模拟器包含arm64，移除它（避免与设备端冲突）\n        lipo \"${SIMULATOR_BINARY}\" -remove arm64 -output \"${SIMULATOR_TEMP_BINARY}\" || {\n            echo \"❌ 错误: 移除模拟器arm64架构失败\"\n            exit 1\n        }\n        echo \"  模拟器处理后架构: $(lipo -info \"${SIMULATOR_TEMP_BINARY}\" | awk -F': ' '{print $NF}')\"\n    else\n        # 模拟器不含arm64，直接使用原文件\n        cp \"${SIMULATOR_BINARY}\" \"${SIMULATOR_TEMP_BINARY}\" || {\n            echo \"❌ 错误: 复制模拟器二进制文件失败\"\n            exit 1\n        }\n        echo \"  模拟器无需处理（不含arm64）\"\n    fi\n    \n    # 合并二进制文件（设备端arm64 + 处理后模拟器x86_64）\n    echo \"开始合并架构（设备端 + 模拟器端）...\"\n    lipo -create \"${DEVICE_BINARY}\" \"${SIMULATOR_TEMP_BINARY}\" -output \"${INSTALL_DIR}/${FMK_NAME}\" || {\n        echo \"❌ 错误: 二进制文件合并失败\"\n        rm -f \"${SIMULATOR_TEMP_BINARY}\"  # 清理临时文件\n        exit 1\n    }\n    rm -f \"${SIMULATOR_TEMP_BINARY}\"  # 清理临时文件\n    \n    # 复制模拟器的Swift模块（确保Swift接口完整）\n    echo \"复制Swift模块文件（支持Swift调用）...\"\n    SIMULATOR_MODULE_DIR=\"${SIMULATOR_DIR}/Modules/${FMK_NAME}.swiftmodule\"\n    DEST_MODULE_DIR=\"${INSTALL_DIR}/Modules/${FMK_NAME}.swiftmodule\"\n    if [ -d \"${SIMULATOR_MODULE_DIR}\" ]; then\n        mkdir -p \"${DEST_MODULE_DIR}\" && cp -R \"${SIMULATOR_MODULE_DIR}/\"* \"${DEST_MODULE_DIR}/\" && {\n            echo \"✅ Swift模块复制成功（包含：$(ls -1 \"${SIMULATOR_MODULE_DIR}\" | wc -l)个文件）\"\n        } || {\n            echo \"⚠️ 警告: Swift模块复制失败（可能影响Swift调用，不影响OC）\"\n        }\n    else\n        echo \"ℹ️ 未找到Swift模块，跳过复制\"\n    fi\n    \n    # 验证合并结果（严格检查架构完整性）\n    echo \"验证合并结果...\"\n    if [ -f \"${INSTALL_DIR}/${FMK_NAME}\" ]; then\n        MERGED_ARCHS=$(lipo -info \"${INSTALL_DIR}/${FMK_NAME}\" | awk -F': ' '{print $NF}')\n        if echo \"${MERGED_ARCHS}\" | grep -q \"arm64\" && echo \"${MERGED_ARCHS}\" | grep -q \"x86_64\"; then\n            echo \"✅ 合并成功！最终架构: ${MERGED_ARCHS}\"\n        else\n            echo \"❌ 错误: 合并后的架构不完整（需同时包含arm64和x86_64）\"\n            echo \"   实际架构: ${MERGED_ARCHS}\"\n            exit 1\n        fi\n    else\n        echo \"❌ 错误: 合并后的二进制文件不存在\"\n        exit 1\n    fi\n    \n    # 打开输出目录（方便查看结果）\n    echo \"===== Framework合并完成 =====\"\n    echo \"输出路径: ${INSTALL_DIR}\"\n    open \"${FMK_DIR_NAME}\"\nelse\n    echo \"===== 非build操作（ACTION=${ACTION}），跳过合并 =====\"\nfi\n";
		};
